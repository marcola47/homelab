services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: marcola:marcola
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - /srv/storage/jellyfin/config:/config
      - /srv/storage/jellyfin/cache:/cache
      - type: bind
        source: /srv/storage/jellyfin/libraries/_default/animes
        target: /media/animes
      - type: bind
        source: /srv/storage/jellyfin/libraries/_default/movies
        target: /media/movies
      - type: bind
        source: /srv/storage/jellyfin/libraries/_default/shows
        target: /media/shows
      - type: bind
        source: /srv/storage/jellyfin/libraries/_default/dc_animations
        target: /media/dc_animations
    restart: 'unless-stopped'
    environment:
      - JELLYFIN_PublishedServerUrl=https://flix.marcola.site
