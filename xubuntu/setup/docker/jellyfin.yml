services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: "1000:1000"
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - /home/marcola/.jellyfin/config:/config
      - /home/marcola/.jellyfin/cache:/cache
      - type: bind
        source: /srv/storage/jellyfin/libraries/_default/anime
        target: /media/anime
      - type: bind
        source: /srv/storage/jellyfin/libraries/_default/movies
        target: /media/movies
      - type: bind
        source: /srv/storage/jellyfin/libraries/_default/shows
        target: /media/shows
      - type: bind
        source: /srv/storage/jellyfin/libraries/_default/dc_animations
        target: /media/dc_animations
    restart: unless-stopped
    environment:
      - JELLYFIN_PublishedServerUrl=https://flix.marcola.site
