[project]
name = "homelab"
version = "0.1.0"
description = "Homelab project setup for windows and xubuntu"
readme = "README.md"
authors = [
    { name = "marcola47", email = "mekaminski47@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "ruff>=0.17.3",
]

[project.scripts]
encode = "encoding.encode.main:main"
encode_eval = "encoding.encode_eval.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "encoding"

[tool.ruff]
line-length = 88
target-version = "py315"
exclude = [".venv", "dist", "build"]
src = ["src"]
fix = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
